name: One-shot Next.js security refresh

on:
  push:
    branches: [fix/truthful-commerce-integrity]

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/truthful-commerce-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - name: Refresh Next.js security patch line
        run: npm install --save-exact next@16.3.0 eslint-config-next@16.3.0
      - name: Verify critical/high production audit
        run: npm audit --omit=dev --audit-level=high
      - name: Commit dependency refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: upgrade Next.js to 16.3.0"
          git push origin HEAD:fix/truthful-commerce-integrity
