name: Temporary truth copy polish

on:
  push:
    branches:
      - fix/truthful-commerce-integrity

permissions:
  contents: write

jobs:
  polish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/truthful-commerce-integrity
          fetch-depth: 0

      - name: Remove decorative status claims and tighten PDP wording
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          header = Path('src/components/layout/Header.tsx')
          text = header.read_text()
          text = text.replace('import { SystemBroadcast } from "./SystemBroadcast";\n', '')
          text = text.replace('  const systemStatus = useForgeStore((state) => state.systemStatus);\n', '')
          text = re.sub(r'\n\s*<div className="hidden md:block">\s*<SystemBroadcast />\s*</div>\s*', '\n', text, count=1)
          text = re.sub(r'\n\s*<div className="flex items-center gap-2 px-3 py-1 bg-white/5 border border-white/10 rounded-full">\s*<span className=\{`w-1\.5 h-1\.5 rounded-full \$\{systemStatus.*?</div>\s*', '\n', text, count=1, flags=re.S)
          text = text.replace('<span>Status: Optimal</span>', '<span>Private paid delivery</span>')
          header.write_text(text)

          pdp = Path('src/app/product/[slug]/page.tsx')
          text = pdp.read_text()
          replacements = {
              '"Source code package (.zip)"': '"Private delivery bundle (.zip)"',
              '"ZIP archive (post-purchase)"': '"Private ZIP bundle (post-purchase)"',
              'In Stock': 'Available',
              'Inventory Depleted': 'Unavailable',
              'Price Tracking': 'Price',
              'Link Protocols': 'Buy Now',
              'Instant Delivery': 'Private Delivery',
              'Secure Payments': 'Cashfree Checkout',
              'Satisfaction Guaranteed': 'Refund Policy',
              '30-day refund policy': '30-day refund review window',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          pdp.write_text(text)
          PY

      - name: Commit wording cleanup
        run: |
          if git diff --quiet -- src/components/layout/Header.tsx 'src/app/product/[slug]/page.tsx'; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/layout/Header.tsx 'src/app/product/[slug]/page.tsx'
          git commit -m "ui: remove decorative status and absolute commerce claims"
          git push origin HEAD:fix/truthful-commerce-integrity
