name: Temporary dependency refresh

on:
  push:
    branches:
      - fix/truthful-commerce-integrity

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/truthful-commerce-integrity
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Refresh vulnerable production dependencies
        run: |
          npm uninstall cashfree-pg
          npm install --save-exact @clerk/nextjs@6.39.6 next@16.2.12
          npm install --save-dev --save-exact eslint-config-next@16.2.12
          npm audit fix --package-lock-only || true

      - name: Commit refreshed manifest and lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: refresh vulnerable production dependencies"
          git push origin HEAD:fix/truthful-commerce-integrity
