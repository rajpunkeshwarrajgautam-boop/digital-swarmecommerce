name: Temporary WebKit product diagnostic

on:
  push:
    branches: [fix/truthful-commerce-integrity]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CASHFREE_APP_ID: ${{ secrets.CASHFREE_APP_ID }}
      CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SECRET_KEY }}
      NEXT_PUBLIC_SITE_URL: https://digitalswarm.in
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - run: npx playwright install --with-deps webkit
      - run: npm run build
      - name: Diagnose WebKit product rendering
        shell: bash
        run: |
          npm run start > /tmp/ds-next.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID || true' EXIT
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:3000/api/health >/dev/null && break
            sleep 0.5
          done
          node <<'NODE'
          const { webkit } = require('@playwright/test');
          (async () => {
            const browser = await webkit.launch();
            const page = await browser.newPage();
            page.on('console', m => console.log('BROWSER_CONSOLE', m.type(), m.text()));
            page.on('pageerror', e => console.log('PAGE_ERROR', e.message, e.stack || ''));
            page.on('requestfailed', r => console.log('REQUEST_FAILED', r.url(), r.failure()?.errorText || ''));
            page.on('response', async r => {
              if (r.url().includes('/api/products/')) {
                console.log('PRODUCT_RESPONSE', r.status(), r.url());
                try { console.log('PRODUCT_BODY', (await r.text()).slice(0, 1000)); } catch {}
              }
            });
            const nav = await page.goto('http://127.0.0.1:3000/product/ai-executive-playbook', { waitUntil: 'domcontentloaded' });
            console.log('NAV_STATUS', nav && nav.status());
            await page.waitForTimeout(8000);
            console.log('FINAL_URL', page.url());
            console.log('BODY_TEXT', (await page.locator('body').innerText()).slice(0, 6000));
            console.log('ADD_STANDARD_COUNT', await page.getByRole('button', { name: /add standard to cart/i }).count());
            console.log('PRODUCT_NOT_FOUND_COUNT', await page.getByText(/product not found/i).count());
            console.log('LOADING_SKELETON_COUNT', await page.locator('.animate-pulse').count());
            await browser.close();
          })().catch(e => { console.error('DIAGNOSTIC_FATAL', e); process.exit(1); });
          NODE
          echo '--- NEXT SERVER LOG ---'
          tail -n 200 /tmp/ds-next.log
