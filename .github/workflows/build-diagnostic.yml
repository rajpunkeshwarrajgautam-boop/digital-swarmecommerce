name: Temporary build diagnostic

on:
  push:
    branches: [fix/truthful-commerce-integrity]

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      CASHFREE_APP_ID: ${{ secrets.CASHFREE_APP_ID }}
      CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SECRET_KEY }}
      NEXT_PUBLIC_SITE_URL: https://digitalswarm.in
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/truthful-commerce-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - name: Capture concise build failure
        shell: bash
        run: |
          set +e
          npm run build > /tmp/build.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            printf 'BUILD_OK\n' > BUILD_DIAGNOSTIC.txt
          else
            { printf 'BUILD_FAILED\n\n'; grep -E -B 4 -A 12 'Type error:|error TS[0-9]+|Failed to type check|Module not found|Build error|Error:' /tmp/build.log | tail -n 180; printf '\n---TAIL---\n'; tail -n 80 /tmp/build.log; } > BUILD_DIAGNOSTIC.txt
          fi
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_DIAGNOSTIC.txt
          git commit -m "chore: capture build diagnostic"
          git push origin HEAD:fix/truthful-commerce-integrity
