name: One-shot add Vitest

on:
  push:
    branches: [fix/truthful-commerce-integrity]

permissions:
  contents: write

jobs:
  add-vitest:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/truthful-commerce-integrity
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --silent
      - name: Add test runner
        run: npm install --save-dev vitest@latest
      - name: Verify tests are invokable
        run: npx vitest --version
      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "test: add Vitest runner"
          git push origin HEAD:fix/truthful-commerce-integrity
