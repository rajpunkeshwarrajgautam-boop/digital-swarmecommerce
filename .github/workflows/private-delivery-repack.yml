name: Temporary private delivery repack

on:
  push:
    branches:
      - fix/truthful-commerce-integrity

jobs:
  repack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: fix/truthful-commerce-integrity

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure zip utility
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: Repack private paid deliverables
        run: node scripts/repack-private-deliverables.mjs
