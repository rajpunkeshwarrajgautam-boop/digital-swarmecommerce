name: Temporary agency cart link fix

on:
  push:
    branches:
      - fix/truthful-commerce-integrity

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/truthful-commerce-integrity
          fetch-depth: 0

      - name: Normalize product links for agency cart IDs
        run: |
          python - <<'PY'
          from pathlib import Path
          for filename in ['src/app/cart/page.tsx', 'src/components/cart/CartDrawer.tsx']:
              path = Path(filename)
              text = path.read_text()
              text = text.replace('`/product/${item.productId}`', '`/product/${item.productId.replace(/-whitelabel$/, "")}`')
              path.write_text(text)
          PY

      - name: Commit link fix
        run: |
          if git diff --quiet -- src/app/cart/page.tsx src/components/cart/CartDrawer.tsx; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/cart/page.tsx src/components/cart/CartDrawer.tsx
          git commit -m "fix: keep agency cart product links routable"
          git push origin HEAD:fix/truthful-commerce-integrity
